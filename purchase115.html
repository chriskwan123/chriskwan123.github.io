<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>採購授權｜模擬題庫</title><style>
:root{--ink:#163435;--teal:#087f78;--line:#d8e5e3}*{box-sizing:border-box}body{margin:0;background:#f1f6f5;color:var(--ink);font:16px/1.7 "Microsoft JhengHei",sans-serif}main{max-width:1120px;margin:auto;padding:32px 20px}h1{font-size:30px;margin:4px 0}h2{font-size:21px}p{margin:8px 0}.eyebrow{color:var(--teal);font-weight:bold;letter-spacing:2px}.muted{color:#607675;font-size:14px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;margin-top:20px;box-shadow:0 5px 18px #173f3506}.settings{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}label{display:block}select,input[type=number]{width:100%;padding:10px;border:1px solid #a8bdb9;border-radius:8px;background:white;font:inherit;color:inherit}button{font:inherit;cursor:pointer;padding:10px 18px;border-radius:9px;border:1px solid var(--line);background:white;color:var(--ink)}button:hover{background:#edf6f4}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #edab35;outline-offset:3px}button:disabled{opacity:.45;cursor:default}.primary{background:var(--teal);color:white;border-color:var(--teal)}.primary:hover{background:#06665f}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}.stats{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.progress{height:7px;background:#e1ece9;border-radius:9px;margin-top:14px;overflow:hidden}.progress span{display:block;height:100%;background:var(--teal)}.question{font-size:21px;line-height:1.8;margin:20px 0}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px}.selected{border:2px solid var(--teal);background:#e8f5f1}.good{border:2px solid #268150;background:#edf8f0}.bad{border:2px solid #c24a43;background:#fff0ed}.analysis{padding:16px;background:#f8f4e9;border-radius:10px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.grid button{padding:7px 0;font-size:14px}.grid .current{outline:2px solid var(--teal);outline-offset:1px}.flag{box-shadow:inset 0 -4px #efb535}.hidden{display:none!important}#message{color:#9e4336;min-height:24px}.review{border-top:1px solid var(--line);padding:18px 0}.big{font-size:42px;font-weight:bold;color:var(--teal)}summary{cursor:pointer}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}@media(max-width:760px){main{padding:20px 12px}h1{font-size:24px}.settings{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.card{padding:18px}.grid{grid-template-columns:repeat(10,1fr)}.question{font-size:19px}}@media(max-width:420px){.settings{grid-template-columns:1fr}.grid{grid-template-columns:repeat(5,1fr)}}
</style></head><body><main><div class="eyebrow">115 採購核心特訓</div><h1>採購授權・線上模擬題庫</h1><p class="muted">100 題涵蓋工程、財物、勞務與工安。依你的節奏練習，集中補強不熟的觀念。</p>
<section class="card" id="setup"><h2>設定本輪練習</h2><div class="settings"><label>主題分類<select id="category"><option value="all">全部主題（100 題）</option><option value="0">共同基礎（1–10）</option><option value="1">金額與門檻（11–20）</option><option value="2">工程採購（21–40）</option><option value="3">財物採購（41–60）</option><option value="4">勞務採購（61–80）</option><option value="5">工安與契約（81–100）</option></select></label><label>作答模式<select id="mode"><option value="practice">練習：提交後看解析</option><option value="exam">模擬考：交卷後看答案</option></select></label><label>題數<input id="count" type="number" min="1" max="100" placeholder="留白＝全部"></label><label>限時（分鐘）<input id="minutes" type="number" min="1" max="180" placeholder="留白＝不限時"></label></div><div class="actions"><label><input id="shuffle" type="checkbox" checked> 隨機出題</label></div><div class="actions"><button class="primary" id="start">開始作答</button><button id="resume" class="hidden">接續上次進度</button><button id="wrongStart">錯題重練 <span id="wrongCount">0</span> 題</button><button id="flagStart">標記題複習</button></div><p class="muted">作答進度、錯題與標記儲存在此瀏覽器。模擬考可修改答案，未作答以 0 分計。</p></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="session" class="hidden"><div class="card"><div class="stats"><strong id="modeLabel"></strong><span id="progressText"></span><span id="clock" role="timer"></span></div><div class="progress"><span id="bar"></span></div></div><div class="layout"><article class="card"><div class="toolbar"><span class="muted" id="meta"></span><button id="mark">☆ 標記複習</button></div><h2 class="question" id="question"></h2><div id="options"></div><div id="feedback" role="status" aria-live="polite"></div><div id="analysis" class="analysis hidden"></div><div class="actions"><button id="prev">上一題</button><button id="check" class="primary">確認答案</button><button id="next">下一題</button><button id="finish">交卷結算</button></div><div class="actions"><button id="settings">返回設定（保留進度）</button></div></article><aside class="card"><h2>題號導覽</h2><p class="muted">綠：答對／灰綠：已選<br>紅：答錯／底線黃：標記</p><div id="nav" class="grid"></div><p class="muted">鍵盤：1–4 選答案、Enter 確認、← → 換題</p></aside></div></section>
<section id="result" class="card hidden"></section><footer class="muted" style="margin-top:24px">題目與解析沿用原始題庫；此頁改善作答功能，未重新查核採購規定。</footer></main><script>
const allQuestions = [
    // 共同基礎與基本觀念 (1-10)
    { q: "1. 關於各營業處採購授權簡表所列之採購金額，下列敘述何者正確？", a: ["皆為不含稅金額", "皆為含稅金額且包含供給材料金額", "皆為含稅金額，但不含供給材料金額", "由各營業處自行決定是否含稅"], c: 2, p: "解析：依工程簡表註1規定，採購金額為含稅金額，且不含供給材料金額。" },
    { q: "2. 根據簡表定義，數值中寫有「以上」、「以下」之處，其數值本身是否包含在內？", a: ["皆不包含本數", "以上包含，以下不包含", "皆包含本數", "視採購類別而定"], c: 2, p: "解析：依工程簡表註1規定，所有「以上」、「以下」之數值皆包含本數。" },
    { q: "3. 依規定印花稅應如何貼附？", a: ["契約或報價單貼千分之一印花稅，契約若已含營業稅應扣除後計貼", "不論是否含稅皆以總額貼千分之五", "一律免貼印花稅", "貼萬分之五印花稅"], c: 0, p: "解析：依工程簡表註1，契約或報價單貼千分之一印花稅，已含營業稅應扣除後計貼。" },
    { q: "4. 決標前進行廠商停權資格查詢時，必須到政府電子採購網站查詢哪一項？", a: ["優良廠商名單", "拒絕往來廠商", "廠商財務評級", "限制招標黑名單"], c: 1, p: "解析：依簡表註2規定，決標前皆須至政府電子採購網站查詢「拒絕往來廠商」。" },
    { q: "5. 除了政府電子採購網外，決標前還須至中油公司網站的何種系統進行查詢排除？", a: ["ERP採購管制系統", "停權程序進行中廠商管理系統", "工安違規通報系統", "廠商誠信稽核網"], c: 1, p: "解析：依簡表註2規定，決標前須至本公司網站「停權程序進行中廠商管理系統」項下查詢。" },
    { q: "6. 在MI系統中，簡表指出的「QB 與 WB之管理師或主管」通常係指何者？", a: ["採購主管", "會計主管", "修護主管", "工安主管"], c: 2, p: "解析：依工程簡表註2，QB與WB之管理師或主管係為修護主管。" },
    { q: "7. 辦理 15 萬元以下之小額採購時，原則上由哪一個部門負責辦理詢價與擬訂圖說？", a: ["行政組採購科", "工務組", "申請(需求)部門", "會計組"], c: 2, p: "解析：依工程簡表註3(1)，15萬元以下小額採購由申請(需求)部門辦理。" },
    { q: "8. 辦理小額採購進行市場詢價時，若未訂定底價，應在程序中如何處理？", a: ["直接核定即可免處理", "必須另函報總公司備查", "應於敘明理由後辦理", "由會計組強制逕行補訂"], c: 2, p: "解析：依工程簡表註3(1)，免訂底價者應敘明理由。" },
    { q: "9. 小額採購如果沒有特別訂定簡易契約，會以何種文件作為契約依據併同簽報核定？", a: ["口頭協議紀錄", "招標公告公文", "洽減核定之廠商報價單/比價單", "工作安全許可證"], c: 2, p: "解析：依工程簡表註3(1)，無需訂定簡易契約者，以洽減核定之廠商報價單/比價單為依據。" },
    { q: "10. 依簡表規定，零售管理師是指哪一個單位的業務管理師？", a: ["總公司採購處", "各營業處行政組", "各零售中心(含馬公直銷中心)", "事業部主管室"], c: 2, p: "解析：依勞務與財物簡表職稱說明，零售管理師為各零售中心業務管理師(含馬公直銷中心)。" },

    // 金額級距與法規門檻 (11-20)
    { q: "11. 依據財物採購作業授權簡表規定，新臺幣多少金額以下之採購得逕洽廠商採購而免附報價單？", a: ["3,000元", "5,000元", "10,000元", "15,000元"], c: 2, p: "解析：依財物簡表註3規定，10,000元以下得逕洽廠商採購免報價單。" },
    { q: "12. 財物與勞務採購中，若金額在 75,001 元至 150,000 元之間，原則上應取得幾家以上的報價單辦理比價？", a: ["一家", "二家", "三家", "五家"], c: 1, p: "解析：依財物及勞務簡表註3，75,001元至15萬元應取得二家以上報價單辦理比價。" },
    { q: "13. 根據工程採購授權簡表，公告金額之起算門檻為新臺幣多少元以上？", a: ["100萬元", "150萬元", "1,000萬元", "5,000萬元"], c: 1, p: "解析：依工程簡表註7規定，公告金額為150萬元以上。" },
    { q: "14. 根據工程採購授權簡表，查核金額之起算標準為新臺幣多少元以上？", a: ["1,500萬元", "5,000萬元", "1億元", "10億元"], c: 1, p: "解析：依工程簡表註7規定，工程查核金額為5,000萬元以上。" },
    { q: "15. 根據財物採購作業授權簡表，其「巨額採購」之定義金額為新臺幣多少元以上？", a: ["2,000萬元", "5,000萬元", "1億元", "10億元"], c: 2, p: "解析：依財物簡表註7規定，財物之巨額採購為1億元以上。" },
    { q: "16. 根據勞務採購作業授權簡表，其「查核金額」之起算標準為新臺幣多少元以上？", a: ["1,000萬元", "1,500萬元", "2,000萬元", "5,000萬元"], c: 0, p: "解析：依勞務簡表註1規定，勞務案之查核金額為1,000萬元以上。" },
    { q: "17. 根據勞務採購作業授權簡表，其「巨額採購」之起算標準為新臺幣多少元以上？", a: ["2,000萬元", "5,000萬元", "1億元", "2億元"], c: 0, p: "解析：依勞務簡表註1規定，勞務案之巨額採購為2,000萬元以上。" },
    { q: "18. 在小額採購履約中，財物採購金額新臺幣多少元以下者，得免附施工或履約照片直接檢據核銷？", a: ["5,000元", "10,000元", "15,000元", "50,000元"], c: 2, p: "解析：依財物簡表註3規定，財物採購金額新臺幣15,000元以下者，得免附照片。" },
    { q: "19. 在工程採購小額採購案中，金額在新臺幣多少元以下者，得免附工程改善前中後照片？", a: ["3,000元", "5,000元", "10,000元", "15,000元"], c: 1, p: "解析：依工程簡表註3(2)規定，工程採購金額新臺幣5,000元以下者，得免附照片。" },
    { q: "20. 依據財物採購規定，預算屬於何種性質者，皆應填列用料預算表/請購單並導入ERP財物採購管理系統？", a: ["經常門支出", "資本支出", "業務管理費", "特別公關費"], c: 1, p: "解析：依財物簡表註12規定，預算為資本支出者，皆應填列用料預算表/請購單(ERP財物採購管理系統)。" },

    // 工程採購權責與公文流轉 (21-40)
    { q: "21. 工程採購金額在 1 元至 150,000 元級距，其申請文件及經辦核定之最低授權層級 homes？", a: ["經理/組長", "副處長", "處長", "執行長"], c: 0, p: "解析：對應工程A表第一分類（15萬以下），核定權責為經理/組長。" },
    { q: "22. 工程採購金額在 150,001 元至 1,499,999 元，其申請案件之最低核定人為何？", a: ["經理/組長", "副處長", "處長", "總經理"], c: 1, p: "解析：對應工程A表第二分類，申請核定權責為副處長。" },
    { q: "23. 工程採購金額在 1,500,000 元至 4,999,999 元（第三分類），其預算核定層級為何？", a: ["副處長", "處長", "事業部執行長", "總公司"], c: 1, p: "解析：對應工程A表第三分類，預算書及詳細價目核定人為處長。" },
    { q: "24. 工程採購金額在 5,000,000 元至 49,999,999 元（第四分類），其發包簽約由何單位負責辦理？", a: ["各營業處行政組", "各營業處工務組", "總公司採購處", "經濟部採購中心"], c: 2, p: "解析：對應工程A表第四分類，發包由採購處辦理、並由採購處簽約。" },
    { q: "25. 工程採購金額在 50,000,000 元至 99,999,999 元（第五分類），請購時申請文件應加會哪一個特別單位？", a: ["人資組", "資訊組", "法務單位", "技術處"], c: 2, p: "解析：對應工程A表第五分類說明，說明書與契約範本皆須加會法務單位。" },
    { q: "26. 工程採購金額在 50,000,000 元至 99,999,999 元（第五分類），其申請文件最低應陳核至何層級核定？", a: ["處長", "處長核可轉陳執行長", "處長核可轉陳副總經理", "處長核可轉陳總經理"], c: 1, p: "解析：對應工程A表第五分類，申請核定欄位為處長核可轉陳執行長。" },
    { q: "27. 工程採購金額在 100,000,000 元至 499,999,999 元（第六分類），其請購核定權責為何？", a: ["處長核可轉陳執行長", "處長核可轉事業部轉陳副總經理", "處長核可轉事業部轉陳總經理", "直報董事會"], c: 1, p: "解析：對應工程A表第六分類，請購核定為處長核可轉事業部轉陳副總經理。" },
    { q: "28. 工程採購金額在 500,000,000 元至 999,999,999 元（第七分類），其發包預算應陳核至何層級？", a: ["副總經理", "總經理", "執行長", "董事長"], c: 1, p: "解析：對應工程A表第七分類，預算核定欄位為處長核可轉事業部轉陳總經理。" },
    { q: "29. 工程採購金額達 10 億元以上之巨額案件（第八分類），請購應加附何種特殊評估表？", a: ["安全衛生自主管理表", "資通採購資安檢點表", "巨額效益評估表", "特定資格訂定說明書"], c: 2, p: "解析：對應工程A表第八分類（10億元以上），文件需含「巨額效益評估表」。" },
    { q: "30. 工程採購金額達 10 億元以上案件（第八分類），其最終請購與預算之核定層級為中油公司何處？", a: ["總經理", "董事長", "董事會", "經濟部"], c: 2, p: "解析：對應工程A表第八分類，其申請與預算最終核定皆為「處長核可轉事業部轉陳董事會」。" },
    { q: "31. 在工程採購第二分類（15萬至149.9萬元），底價之擬訂由誰簽報？", a: ["工務組長", "會計組長", "由規劃、設計或使用部門提出採購金額分析，由採購承辦部門簽報", "由副處長親自擬訂"], c: 2, p: "解析：工程簡表第二分類底價擬訂欄載明：由規劃、設計或使用部門提出採購金額及其分析，由採購承辦部門簽報。" },
    { q: "32. 工程採購第三分類（150萬至499.9萬元）案件，其發包底價由誰負責核定？", a: ["副處長", "處長", "採購處長", "執行長"], c: 1, p: "解析：工程簡表第三分類中，底價核定權責屬於處長。" },
    { q: "33. 工程採購第一分類（15萬元以下）辦理議價洽減後，其報銷單據之請款核定人為誰？", a: ["經理/組長", "副處長", "處長", "會計組長"], c: 0, p: "解析：工程第一分類中，報銷單據請款之核定層級為「經理/組長」。" },
    { q: "34. 工程採購第二分類（15萬至149.9萬元）案件完工後，結算驗收證明書應由誰核定？", a: ["經理", "組長", "副處長", "處長"], c: 2, p: "解析：工程2分類中，結算驗收證明書之核定人為副處長。" },

const $=id=>document.getElementById(id), KEY='purchase115.v2';
let saved={},s=null,wrong=new Set(),flags=new Set(),history=[];
try{saved=JSON.parse(localStorage.getItem(KEY)||'{}');wrong=new Set(saved.wrong||[]);flags=new Set(saved.flags||[]);history=saved.history||[];}catch(e){}
const groups=['共同基礎','金額與門檻','工程採購','財物採購','勞務採購','工安與契約'];
function group(id){return id<10?0:id<20?1:id<40?2:id<60?3:id<80?4:5;}
function save(){try{localStorage.setItem(KEY,JSON.stringify({session:s,wrong:[...wrong],flags:[...flags],history}));saved.session=s;}catch(e){$('message').textContent='瀏覽器無法儲存進度，請勿關閉本頁。';}updateSetup();}
function updateSetup(){$('wrongCount').textContent=wrong.size;$('wrongStart').disabled=!wrong.size;$('flagStart').disabled=!flags.size;$('resume').classList.toggle('hidden',!saved.session||saved.session.done);}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function start(pool){if(s&&!s.done&&!confirm('開始新一輪將取代目前進度，是否繼續？'))return;
let count=$('count').value,minutes=$('minutes').value;
if(count&&(!Number.isInteger(+count)||+count<1||+count>100)||minutes&&(!Number.isInteger(+minutes)||+minutes<1||+minutes>180)){$('message').textContent='題數請填 1–100 的整數，限時請填 1–180 的整數。';return;}
let ids=pool||allQuestions.map((_,i)=>i).filter(i=>$('category').value==='all'||group(i)===+$('category').value);
if(!ids.length){$('message').textContent='目前沒有可練習的題目。';return;}ids=[...ids];if($('shuffle').checked)shuffle(ids);ids=ids.slice(0,count?+count:ids.length);
s={ids,answers:Array(ids.length).fill(null),checked:Array(ids.length).fill(false),pos:0,mode:$('mode').value,started:Date.now(),deadline:minutes?Date.now()+(+minutes)*60000:null,done:false};save();openSession();}
function openSession(){$('setup').classList.add('hidden');$('result').classList.add('hidden');$('session').classList.remove('hidden');$('message').textContent='';render();tick();}
function render(){let k=s.pos,id=s.ids[k],q=allQuestions[id],reveal=s.checked[k]&&s.mode==='practice';$('modeLabel').textContent=s.mode==='practice'?'逐題練習':'模擬考';let n=s.answers.filter(x=>x!==null).length;$('progressText').textContent=`已選 ${n} / ${s.ids.length} 題`;$('bar').style.width=n/s.ids.length*100+'%';$('meta').textContent=`第 ${k+1} / ${s.ids.length} 題 · ${groups[group(id)]} · 原題 ${id+1}`;$('question').textContent=q.q;$('mark').textContent=flags.has(id)?'★ 已標記':'☆ 標記複習';$('mark').setAttribute('aria-pressed',flags.has(id));$('options').replaceChildren();q.a.forEach((text,i)=>{let b=document.createElement('button');b.className='option'+(s.answers[k]===i?' selected':'')+(reveal&&i===q.c?' good':'')+(reveal&&s.answers[k]===i&&i!==q.c?' bad':'');b.textContent=`${String.fromCharCode(65+i)}. ${text}`+(reveal&&i===q.c?' ✓ 正確答案':'');b.disabled=reveal;b.setAttribute('aria-pressed',s.answers[k]===i);b.onclick=()=>{s.answers[k]=i;save();render();};$('options').append(b);});$('feedback').textContent=reveal?(s.answers[k]===q.c?'✓ 答對了！':`✗ 答錯了，正確答案是 ${String.fromCharCode(65+q.c)}。`):'';$('analysis').textContent=q.p;$('analysis').classList.toggle('hidden',!reveal);$('check').classList.toggle('hidden',s.mode==='exam');$('check').disabled=reveal||s.answers[k]===null;$('prev').disabled=k===0;$('next').disabled=k===s.ids.length-1;$('nav').replaceChildren();s.ids.forEach((id,i)=>{let b=document.createElement('button');let checked=s.checked[i]&&s.mode==='practice';b.className=(i===k?'current ':'')+(flags.has(id)?'flag ':'')+(checked?(s.answers[i]===allQuestions[id].c?'good':'bad'):s.answers[i]!==null?'selected':'');b.textContent=i+1;b.title=`原題 ${id+1}，`+(s.answers[i]===null?'未作答':'已選答案');b.setAttribute('aria-label',b.title);if(i===k)b.setAttribute('aria-current','true');b.onclick=()=>move(i);$('nav').append(b);});}
function move(i){s.pos=i;save();render();}
function record(i){let id=s.ids[i];if(s.answers[i]===allQuestions[id].c)wrong.delete(id);else wrong.add(id);}
function check(){if(!s||s.done||s.mode!=='practice'||s.checked[s.pos]||s.answers[s.pos]===null)return;s.checked[s.pos]=true;record(s.pos);save();render();}
function finish(auto=false){if(!s||s.done)return;let left=s.answers.filter(a=>a===null).length;if(!auto&&!confirm(`確定交卷？${left?'還有 '+left+' 題未作答，將以 0 分計。':'將結算本輪成績。'}`))return;s.done=true;s.ended=Date.now();s.ids.forEach((_,i)=>record(i));let correct=s.ids.filter((id,i)=>s.answers[i]===allQuestions[id].c).length;history.unshift({date:new Date().toLocaleString('zh-TW'),score:Math.round(correct/s.ids.length*100),total:s.ids.length});history=history.slice(0,10);save();showResult(auto);}
function showResult(auto){$('session').classList.add('hidden');$('result').classList.remove('hidden');let correct=s.ids.filter((id,i)=>s.answers[i]===allQuestions[id].c).length,empty=s.answers.filter(a=>a===null).length;$('result').innerHTML=`<h2>${auto?'時間到，已自動交卷':'本輪作答完成'}</h2><div class="big">${Math.round(correct/s.ids.length*100)} <small style="font-size:18px">分 / 100</small></div><p>答對 ${correct} 題 · 答錯 ${s.ids.length-correct-empty} 題 · 未答 ${empty} 題</p><p class="muted">每題等權計分 · 用時 ${format(Math.floor((s.ended-s.started)/1000))}</p><div class="actions"><button id="retry" class="primary">本輪錯題重練</button><button id="back">重新設定</button><button id="export">下載成績紀錄</button></div><h2>答案與解析</h2><label>檢視範圍<select id="filter"><option value="all">全部題目</option><option value="wrong">答錯與未答</option><option value="flag">已標記</option></select></label><div id="reviews"></div><details><summary>最近 ${history.length} 次成績</summary><div id="history"></div></details>`;let failed=s.ids.filter((id,i)=>s.answers[i]!==allQuestions[id].c);$('retry').disabled=!failed.length;$('retry').onclick=()=>{$('mode').value='practice';$('count').value='';start(failed);};$('back').onclick=back;$('export').onclick=exportResult;$('filter').onchange=reviews;$('history').textContent=history.map(h=>`${h.date}：${h.score} 分（${h.total} 題）`).join(' ／ ');reviews();}
function reviews(){$('reviews').replaceChildren();s.ids.forEach((id,i)=>{let q=allQuestions[id],ok=s.answers[i]===q.c;if($('filter').value==='wrong'&&ok||$('filter').value==='flag'&&!flags.has(id))return;let d=document.createElement('details');d.className='review';let summary=document.createElement('summary');summary.textContent=`${ok?'✓':'✗'} ${q.q}${flags.has(id)?' ★':''}`;let p=document.createElement('p');p.textContent=`你的答案：${s.answers[i]===null?'未作答':String.fromCharCode(65+s.answers[i])+' '+q.a[s.answers[i]]}；正確答案：${String.fromCharCode(65+q.c)} ${q.a[q.c]}`;let a=document.createElement('p');a.textContent=q.p;d.append(summary,p,a);$('reviews').append(d);});if(!$('reviews').children.length)$('reviews').textContent='此範圍沒有題目。';}
function exportResult(){let text=['採購授權模擬題庫成績',history[0].date,`得分：${history[0].score} / 100`];s.ids.forEach((id,i)=>text.push(`${allQuestions[id].q}\n作答：${s.answers[i]===null?'未作答':String.fromCharCode(65+s.answers[i])}；正確：${String.fromCharCode(65+allQuestions[id].c)}\n${allQuestions[id].p}`));let url=URL.createObjectURL(new Blob(['\ufeff'+text.join('\n\n')],{type:'text/plain;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='採購題庫成績.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function back(){$('session').classList.add('hidden');$('result').classList.add('hidden');$('setup').classList.remove('hidden');updateSetup();}
function format(t){return `${Math.floor(t/60).toString().padStart(2,'0')}:${(t%60).toString().padStart(2,'0')}`;}
function tick(){if(!s||s.done)return;if(s.deadline){let sec=Math.max(0,Math.ceil((s.deadline-Date.now())/1000));$('clock').textContent='剩餘 '+format(sec);if(sec===0)finish(true);}else $('clock').textContent='已用 '+format(Math.floor((Date.now()-s.started)/1000));}
$('start').onclick=()=>start();$('wrongStart').onclick=()=>start([...wrong]);$('flagStart').onclick=()=>start([...flags]);$('resume').onclick=()=>{s=saved.session;openSession();};$('prev').onclick=()=>move(s.pos-1);$('next').onclick=()=>move(s.pos+1);$('check').onclick=check;$('finish').onclick=()=>finish();$('settings').onclick=back;$('mark').onclick=()=>{let id=s.ids[s.pos];flags.has(id)?flags.delete(id):flags.add(id);save();render();};document.addEventListener('keydown',e=>{if(!s||s.done||$('session').classList.contains('hidden')||/INPUT|SELECT|BUTTON/.test(e.target.tagName))return;if(['1','2','3','4'].includes(e.key)){let b=$('options').children[+e.key-1];if(b&&!b.disabled)b.click();}if(e.key==='Enter')check();if(e.key==='ArrowLeft'&&s.pos>0)move(s.pos-1);if(e.key==='ArrowRight'&&s.pos<s.ids.length-1)move(s.pos+1);});setInterval(tick,1000);s=saved.session||null;updateSetup();
</script></body></html>
